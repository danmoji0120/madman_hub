<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>꾸미기 상점 | MADMEN HUB</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="/">MADMEN HUB</a>
    <nav class="nav-links">
      <a href="/members.html">거주민</a>
      <a href="/posts.html">게시판</a>
      <a href="/shop.html">칭호 상점</a>
      <a href="/cosmetics.html">꾸미기 상점</a>
      <a href="/profile.html">내 프로필</a>
    </nav>
  </header>
  <main class="container">
    <section class="hero">
      <span class="badge">MVP 1.4</span>
      <h1>꾸미기 상점</h1>
      <p>포인트로 프로필 테두리, 배경, 닉네임 색상을 구매하고 장착하세요.</p>
    </section>
    <section class="card">
      <div class="stat-row">
        <div><h2>내 포인트</h2><p class="meta">로그인하면 구매와 장착이 가능합니다.</p></div>
        <strong class="point" id="cosmetics-points">-</strong>
      </div>
      <div class="hero-actions">
        <button class="button secondary inline" onclick="setCosmeticFilter('')">전체</button>
        <button class="button secondary inline" onclick="setCosmeticFilter('profile_frame')">테두리</button>
        <button class="button secondary inline" onclick="setCosmeticFilter('profile_background')">배경</button>
        <button class="button secondary inline" onclick="setCosmeticFilter('nickname_color')">닉네임 색상</button>
        <button class="button secondary inline" onclick="setOwnedOnly()">보유 중</button>
      </div>
      <p class="message" id="cosmetics-message"></p>
    </section>
    <section class="shop-grid" id="cosmetics-shop" style="margin-top: 18px;"></section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/cosmetics.js"></script>
</body>
</html>
