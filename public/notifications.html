<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>알림 센터 | MADMEN HUB</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="nav app-header">
    <a class="logo app-brand" href="/">MADMEN HUB</a>
    <nav class="nav-links dashboard-nav top-nav" aria-label="주요 메뉴">
      <a data-global-nav="home" href="/">홈</a>
      <a data-global-nav="community" href="/index.html#community">커뮤니티</a>
      <a data-global-nav="casino" href="/casino.html">카지노</a>
      <a data-global-nav="season" href="/index.html#season">시즌</a>
      <a data-global-nav="account" href="/index.html#account">내 정보</a>
      <a data-global-nav="more" href="/index.html#more" class="active" aria-current="page">더보기</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <span class="badge">V1.8</span>
      <h1>알림 센터</h1>
      <p>댓글, 멘션, 칭호, 시즌 기록, 카지노 사건, 관리자 공지를 한 곳에서 확인합니다.</p>
    </section>

    <p id="notifications-message" class="message"></p>

    <section class="card">
      <div class="section-heading">
        <div>
          <h2>내 알림</h2>
          <p class="meta" id="notifications-summary">불러오는 중...</p>
        </div>
        <div class="hero-actions">
          <button class="button secondary inline small-button" onclick="markAllNotificationsRead()">전체 읽음</button>
          <button class="button secondary inline small-button" onclick="loadNotifications()">새로고침</button>
        </div>
      </div>
      <div class="admin-toolbar">
        <select class="input" id="notification-filter" onchange="loadNotifications()">
          <option value="">전체</option>
          <option value="unread">안읽음</option>
          <option value="post_comment">댓글</option>
          <option value="mention">멘션</option>
          <option value="title_granted">칭호</option>
          <option value="season_hall_of_fame">시즌</option>
          <option value="casino_disaster">카지노</option>
          <option value="admin_notice">관리자 공지</option>
        </select>
      </div>
      <div class="notification-list" id="notification-list"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/formatters.js"></script>
  <script src="/js/titleBadge.js"></script>
  <script src="/js/notificationBadge.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
