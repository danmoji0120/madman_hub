<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Black Office neon underground office background">
  <defs>
    <radialGradient id="pinkGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#ff4fd8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090610" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="78%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#53f5ff" stop-opacity="0.28"/>
      <stop offset="52%" stop-color="#53f5ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090610" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150b26"/>
      <stop offset="58%" stop-color="#0b0713"/>
      <stop offset="100%" stop-color="#050309"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171023" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="1"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="wallGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="floorGrid" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M90 0H0V90" fill="none" stroke="#53f5ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="floorClip">
      <polygon points="0,610 1600,610 1600,900 0,900"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="620" fill="url(#wallGrid)" opacity="0.9"/>
  <rect width="1600" height="900" fill="url(#pinkGlow)"/>
  <rect width="1600" height="900" fill="url(#cyanGlow)"/>

  <!-- back corridor -->
  <path d="M335 176H1265L1165 610H435Z" fill="#0a0610" opacity="0.72"/>
  <path d="M394 226H1206L1124 610H476Z" fill="#130b1f" opacity="0.9"/>
  <path d="M465 282H1135L1077 610H523Z" fill="#08050d" opacity="0.88"/>

  <!-- ceiling lamps -->
  <g filter="url(#neon)">
    <path d="M542 214H1058" stroke="#53f5ff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
    <path d="M640 282H960" stroke="#ff4fd8" stroke-opacity="0.42" stroke-width="3" stroke-linecap="round"/>
    <path d="M700 350H900" stroke="#53f5ff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- side monitors / office signs -->
  <g opacity="0.95">
    <rect x="122" y="236" width="250" height="132" rx="18" fill="#0b0912" stroke="#ff4fd8" stroke-opacity="0.38"/>
    <rect x="143" y="260" width="208" height="18" rx="9" fill="#ff4fd8" opacity="0.28"/>
    <rect x="143" y="298" width="148" height="10" rx="5" fill="#53f5ff" opacity="0.34"/>
    <rect x="143" y="323" width="184" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
    <text x="148" y="350" fill="#ffbdf0" font-family="monospace" font-size="18" font-weight="700">UNPAID</text>

    <rect x="1228" y="250" width="244" height="150" rx="18" fill="#0b0912" stroke="#53f5ff" stroke-opacity="0.34"/>
    <rect x="1252" y="276" width="196" height="18" rx="9" fill="#53f5ff" opacity="0.26"/>
    <rect x="1252" y="315" width="120" height="10" rx="5" fill="#ff4fd8" opacity="0.34"/>
    <rect x="1252" y="342" width="162" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
    <text x="1252" y="377" fill="#b9fbff" font-family="monospace" font-size="17" font-weight="700">SECTION-13</text>
  </g>

  <!-- office furniture silhouettes -->
  <g opacity="0.72">
    <rect x="70" y="548" width="330" height="88" rx="16" fill="#09050c"/>
    <rect x="92" y="504" width="142" height="54" rx="12" fill="#120b18" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="1210" y="558" width="320" height="76" rx="16" fill="#09050c"/>
    <rect x="1350" y="498" width="120" height="70" rx="12" fill="#120b18" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="1028" y="470" width="160" height="110" rx="18" fill="#0b0710" opacity="0.84"/>
    <rect x="1048" y="492" width="120" height="12" rx="6" fill="#ff4fd8" opacity="0.22"/>
    <rect x="1048" y="522" width="92" height="10" rx="5" fill="#53f5ff" opacity="0.2"/>
  </g>

  <!-- floor -->
  <polygon points="0,610 1600,610 1600,900 0,900" fill="url(#floor)"/>
  <g clip-path="url(#floorClip)" opacity="0.8">
    <path d="M800 610 L140 900" stroke="#53f5ff" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M800 610 L420 900" stroke="#53f5ff" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M800 610 L690 900" stroke="#53f5ff" stroke-opacity="0.1" stroke-width="2"/>
    <path d="M800 610 L910 900" stroke="#53f5ff" stroke-opacity="0.1" stroke-width="2"/>
    <path d="M800 610 L1180 900" stroke="#53f5ff" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M800 610 L1460 900" stroke="#53f5ff" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M0 650H1600" stroke="#ffffff" stroke-opacity="0.04"/>
    <path d="M0 708H1600" stroke="#ffffff" stroke-opacity="0.055"/>
    <path d="M0 782H1600" stroke="#ffffff" stroke-opacity="0.07"/>
    <path d="M0 872H1600" stroke="#ffffff" stroke-opacity="0.09"/>
  </g>

  <!-- hazy glows -->
  <ellipse cx="800" cy="620" rx="310" ry="58" fill="#ff4fd8" opacity="0.13" filter="url(#softBlur)"/>
  <ellipse cx="800" cy="700" rx="460" ry="62" fill="#53f5ff" opacity="0.08" filter="url(#softBlur)"/>

  <!-- foreground dark vignette -->
  <rect width="1600" height="900" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="34"/>
  <rect width="1600" height="900" fill="url(#wallGrid)" opacity="0.18"/>
</svg>
