<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 | MADMEN HUB</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="nav app-header">
    <a class="logo app-brand" href="/">MADMEN HUB</a>
    <nav class="nav-links dashboard-nav top-nav" aria-label="주요 메뉴">
      <a data-global-nav="home" href="/" class="active" aria-current="page">홈</a>
      <a data-global-nav="community" href="/index.html#community">커뮤니티</a>
      <a data-global-nav="casino" href="/casino.html">카지노</a>
      <a data-global-nav="season" href="/index.html#season">시즌</a>
      <a data-global-nav="account" href="/index.html#account">내 정보</a>
      <a data-global-nav="more" href="/index.html#more">더보기</a>
    </nav>
  </header>
  <main class="container">
    <form class="card form" onsubmit="handleRegister(event)">
      <h1>회원가입</h1>
      <p class="meta">새 격리 대상을 등록합니다.</p>
      <input class="input" id="displayName" type="text" placeholder="표시 이름" autocomplete="nickname" required />
      <input class="input" id="email" type="email" placeholder="이메일" autocomplete="email" required />
      <input class="input" id="password" type="password" placeholder="비밀번호 6자 이상" autocomplete="new-password" required />
      <button class="button" type="submit">등록하기</button>
      <p id="message" class="message"></p>
      <p class="meta">이미 계정이 있나요? <a href="/login.html">로그인</a></p>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/notificationBadge.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
