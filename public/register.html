<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 | MADMEN HUB</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <main class="container">
    <form class="card form" onsubmit="handleRegister(event)">
      <h1>회원가입</h1>
      <p class="meta">새 격리 대상을 등록합니다.</p>
      <input class="input" id="displayName" type="text" placeholder="표시 이름" autocomplete="nickname" required />
      <input class="input" id="email" type="email" placeholder="이메일" autocomplete="email" required />
      <input class="input" id="password" type="password" placeholder="비밀번호 6자 이상" autocomplete="new-password" required />
      <button class="button" type="submit">등록하기</button>
      <p id="message" class="message"></p>
      <p class="meta">이미 계정이 있나요? <a href="/login.html">로그인</a></p>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
