<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>칭호 상점 | MADMEN HUB</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="nav app-header">
    <a class="logo app-brand" href="/">MADMEN HUB</a>
    <nav class="nav-links dashboard-nav top-nav" aria-label="주요 메뉴">
      <a data-global-nav="home" href="/">홈</a>
      <a data-global-nav="community" href="/index.html#community">커뮤니티</a>
      <a data-global-nav="casino" href="/casino.html">카지노</a>
      <a data-global-nav="season" href="/index.html#season">시즌</a>
      <a data-global-nav="account" href="/index.html#account" class="active" aria-current="page">내 정보</a>
      <a data-global-nav="more" href="/index.html#more">더보기</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <span class="badge">쓸모를 찾은 포인트</span>
      <h1>칭호 상점</h1>
      <p>꾸준히 모은 포인트로 그럴듯한 칭호를 구매하고 프로필에 장착하세요.</p>
    </section>

    <section class="card">
      <div class="stat-row">
        <div>
          <h2>내 포인트</h2>
          <p class="meta" id="shop-account-hint">로그인하면 현재 포인트를 확인할 수 있습니다.</p>
        </div>
        <p class="point" id="shop-points">-</p>
      </div>
      <p class="message" id="shop-message"></p>
    </section>

    <section class="card">
      <div class="admin-toolbar">
        <input class="input" id="title-search-filter" placeholder="칭호 검색" />
        <select class="input" id="title-rarity-filter">
          <option value="">전체 rarity</option>
          <option value="common">common</option>
          <option value="uncommon">uncommon</option>
          <option value="rare">rare</option>
          <option value="epic">epic</option>
          <option value="legendary">legendary</option>
          <option value="event">event</option>
          <option value="admin">admin</option>
          <option value="punishment">punishment</option>
        </select>
        <select class="input" id="title-category-filter">
          <option value="">전체 category</option>
          <option value="shop">shop</option>
          <option value="achievement">achievement</option>
          <option value="season">season</option>
          <option value="casino">casino</option>
          <option value="activity">activity</option>
          <option value="event">event</option>
          <option value="admin">admin</option>
          <option value="punishment">punishment</option>
          <option value="legacy">legacy</option>
        </select>
        <select class="input" id="title-availability-filter">
          <option value="">전체</option>
          <option value="purchasable">구매 가능</option>
          <option value="reward">보상 전용</option>
          <option value="owned">보유 중</option>
        </select>
      </div>
    </section>

    <section class="shop-grid" id="shop-titles" style="margin-top: 18px;"></section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/notificationBadge.js"></script>
  <script src="/js/formatters.js"></script>
  <script src="/js/titleBadge.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
