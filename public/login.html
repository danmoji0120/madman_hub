<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | MADMEN HUB</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="nav app-header">
    <a class="logo app-brand" href="/">MADMEN HUB</a>
    <nav class="nav-links dashboard-nav top-nav" aria-label="주요 메뉴">
      <a data-global-nav="home" href="/" class="active" aria-current="page">홈</a>
      <a data-global-nav="activity" href="/index.html#activity">활동</a>
      <a data-global-nav="community" href="/index.html#community">커뮤니티</a>
      <a data-global-nav="casino" href="/casino.html">카지노</a>
      <a data-global-nav="shop" href="/index.html#shop">상점</a>
      <a data-global-nav="mercenary" href="/index.html#mercenary">용병단</a>
      <a data-global-nav="season" href="/index.html#season">시즌</a>
      <a data-global-nav="account" href="/index.html#account">내 정보</a>
    </nav>
  </header>
  <main class="container">
    <form class="card form" onsubmit="handleLogin(event)">
      <h1>로그인</h1>
      <p class="meta">격리소 출입 인증을 진행합니다.</p>
      <input class="input" id="email" type="email" placeholder="이메일" autocomplete="email" required />
      <input class="input" id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required />
      <button class="button" type="submit">입장하기</button>
      <p id="message" class="message"></p>
      <p class="meta">계정이 없나요? <a href="/register.html">회원가입</a></p>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/notificationBadge.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
