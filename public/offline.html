<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b18" />
  <title>오프라인 - Madmen Hub</title>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0b0b18;
      color: #f6f3ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .offline-card {
      width: min(92vw, 520px);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      background: rgba(13, 15, 32, 0.92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    .offline-card h1 {
      margin: 0 0 12px;
      font-size: clamp(1.7rem, 6vw, 2.5rem);
    }

    .offline-card p {
      color: rgba(246, 243, 255, 0.72);
      line-height: 1.7;
    }

    .offline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .offline-actions a,
    .offline-actions button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      background: #ff4fd8;
      color: #120719;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .offline-actions .secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #f6f3ff;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <span class="badge">OFFLINE</span>
    <h1>지금은 연결이 끊겼습니다.</h1>
    <p>
      인터넷 연결을 확인한 뒤 다시 시도해 주세요. 게시글 작성, 출석, 포인트, 카지노 정산처럼 서버 확인이 필요한 기능은 온라인 상태에서만 동작합니다.
    </p>
    <div class="offline-actions">
      <button type="button" onclick="location.reload()">다시 시도</button>
      <a class="secondary" href="/">홈으로</a>
    </div>
  </main>
</body>
</html>
