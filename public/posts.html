<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>게시판 | MADMEN HUB</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="/">MADMEN HUB</a>
    <nav class="nav-links">
      <a href="/songs.html">노래추천</a>
      <a href="/members.html">거주민</a>
      <a href="/guestbook.html">방명록</a>
      <a href="/shop.html">칭호 상점</a>
      <a href="/cosmetics.html">꾸미기 상점</a>
      <a href="/seasons.html">시즌 랭킹</a>
      <a href="/casino.html">카지노</a>
      <a href="/profile.html">내 프로필</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>게시판</h1>
      <p>잡담부터 기록문까지, 카테고리와 태그로 원하는 글을 찾아보세요.</p>
    </section>

    <section class="card">
      <h2>게시글 찾기</h2>
      <div class="form-grid">
        <input class="input" id="post-search" placeholder="제목, 본문, 대상 검색" />
        <select class="input" id="post-category-filter"></select>
        <input class="input" id="post-tag-filter" placeholder="태그 검색" />
        <select class="input" id="post-sort">
          <option value="latest">최신순</option>
          <option value="oldest">오래된순</option>
        </select>
      </div>
      <div class="hero-actions">
        <button class="button inline" type="button" onclick="searchPosts()">검색</button>
        <button class="button secondary inline" type="button" onclick="resetPostFilters()">초기화</button>
        <button class="button secondary inline" type="button" onclick="loadRandomPost(this)">선택 조건에서 랜덤 글</button>
      </div>
      <p id="random-post-result" class="message"></p>
    </section>

    <form class="card" style="margin-top: 18px;" onsubmit="postArticle(event)">
      <h2>게시글 작성</h2>
      <select class="input" id="post-category"></select>
      <input class="input" id="post-title" placeholder="제목" maxlength="100" />
      <input class="input" id="post-target" placeholder="관련 대상" maxlength="40" />
      <input class="input" id="post-tags" placeholder="태그, 쉼표로 구분" maxlength="200" />
      <textarea class="textarea" id="post-body" placeholder="게시글 내용" maxlength="2000"></textarea>
      <label class="checkbox-label"><input type="checkbox" id="post-anonymous" /> 익명으로 작성 <span class="meta" id="anonymous-post-cost">비용 5P</span></label>
      <button class="button" type="submit">게시글 작성</button>
      <p id="message" class="message"></p>
    </form>

    <section class="grid" id="posts-list" style="margin-top: 18px;"></section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/titleBadge.js"></script>
  <script src="/js/posts.js"></script>
</body>
</html>
